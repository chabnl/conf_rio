<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMARU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>html, body, #map { height: 100%; margin: 0; }
.legende {
  background: white;
  padding: 8px 10px;
  border-radius: 6px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.4);
  font: 13px/1.4 sans-serif;
}
.legende div { display: flex; align-items: center; margin: 3px 0; }
.legende span.trait {
  display: inline-block; width: 24px; height: 3px; margin-right: 8px;
}
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([-5, -65], 5);   // centre, zoom initial : à ajuster

       L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
     maxZoom: 10,
     minZoom: 4,
     attribution: 'Tiles © Esri'
   }).addTo(map);

    L.tileLayer('tuiles/{z}/{x}/{y}.png', {
      minZoom: 4, maxZoom: 10,
      attribution: 'AMARU river network : [Charlotte Blondel / CNRS/LEGOS]'
    }).addTo(map);

    var legende = L.control({position: 'bottomright'});
legende.onAdd = function () {
  var div = L.DomUtil.create('div', 'legende');
  div.innerHTML =
    '<b>Source</b>' +
    '<div><span class="trait" style="background:#ffa400"></span>ANA</div>' +
    '<div><span class="trait" style="background:#fff600"></span>ANA_Peru</div>' +
'<div><span class="trait" style="background:#00fdff"></span>SWORD</div>' +
'<div><span class="trait" style="background:#ff00ce"></span>Volodia</div>' +
    '<div><span class="trait" style="background:#35ff00"></span>Main</div>';
  return div;
};
legende.addTo(map);

  </script>
</body>
</html>
